<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Répertoire d'ouvertures</title>
  {% load static %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
<div id="app">

  <!-- ═════════════ HEADER ═════════════ -->
  <header id="header">
    <div class="logo"><span class="logo-dot"></span>Répertoire</div>

    <nav id="main-nav">
      <button id="nav-target"   class="active">Visualiser</button>
      <button id="nav-training">S'entraîner</button>
      <button id="nav-correct">Se corriger</button>
    </nav>

    <div class="header-right">
      <select id="repertoire-select"></select>
      <span id="freq-label">Seuil</span>
      <input type="range" id="freq-slider" min="0" max="100" value="50">
      <span id="freq-value">0.10%</span>
      <span class="hsep"></span>
      <span id="bias-label" title="Plus haut = lignes fréquentes privilégiées en entraînement">Biais</span>
      <input type="range" id="bias-slider" min="100" max="400" value="100" step="10">
      <span id="bias-value">×1.0</span>
      <button id="bias-uniform" class="mini-toggle" title="Tirage uniforme : toutes les lignes équiprobables">=</button>
      <span class="hsep"></span>
      <button id="sound-toggle" class="icon-btn" title="Activer/désactiver les sons" aria-label="Sons">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 5L6 9H2v6h4l5 4V5z"/>
          <path d="M19 12c0-2-1-4-3-5M22 12c0-3-1-6-4-8" id="sound-on-paths"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ═════════════ SIDEBAR (arbre) ═════════════ -->
  <aside id="sidebar">
    <div id="sidebar-title">Répertoire</div>
    <div id="tree-container"></div>
  </aside>

  <!-- ═════════════ CENTRE : échiquier + notation ═════════════ -->
  <main id="center">
    <div id="board-wrap">
      <div id="board-container"></div>
    </div>
    <div id="notation-bar"></div>
  </main>

  <!-- ═════════════ PANEL DROIT ═════════════ -->
  <aside id="right-panel">

    <!-- Vue Visualiser -->
    <section id="panel-target" class="panel-view active">
      <div id="target-header">
        <h3 id="target-title">Cible</h3>
        <button id="target-back-btn" class="btn-mini">⏮ Revenir au début</button>
      </div>
      <div id="target-svg-wrap">
        <svg id="target-svg" viewBox="0 0 460 460" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div id="target-breadcrumb"></div>
      <div id="target-info">
        <div class="info-row"><span>Coup actuel</span><span id="ti-move">—</span></div>
        <div class="info-row"><span>Fréquence</span><span id="ti-freq">—</span></div>
        <div class="info-row"><span>Évaluation</span><span id="ti-eval">—</span></div>
      </div>
    </section>

    <!-- Vue Entraînement -->
    <section id="panel-training" class="panel-view">
      <h3 id="training-title">Entraînement</h3>

      <div id="training-status">
        <span class="status-dot"></span>
        <span class="status-text">Prêt à commencer</span>
      </div>

      <div id="training-progress"><div id="training-progress-bar"></div></div>

      <!-- Stats du coup courant en entraînement (dupliqué visuellement de la cible) -->
      <div id="training-info">
        <div class="info-row"><span>Coup affiché</span><span id="ti-move-tr">—</span></div>
        <div class="info-row"><span>Fréquence locale</span><span id="ti-freq-local-tr">—</span></div>
        <div class="info-row"><span>Fréquence cumulée</span><span id="ti-freq-cum-tr">—</span></div>
      </div>

      <div class="row">
        <label class="toggle-row">
          <span>Enchaîner les lignes</span>
          <span class="toggle">
            <input type="checkbox" id="auto-chain-toggle">
            <span class="toggle-track"></span>
          </span>
        </label>
      </div>

      <div id="lock-indicator">
        <span>🔒 Position verrouillée</span>
        <button id="btn-unlock" class="btn-mini">Libérer</button>
      </div>

      <div id="kbd-hint">
        Naviguer : <kbd>←</kbd> <kbd>→</kbd>
      </div>

      <div id="training-actions">
        <button id="btn-next-line" class="btn btn-primary">Nouvelle ligne</button>
        <button id="btn-hint"      class="btn btn-gold">Indice</button>
        <button id="btn-lock"      class="btn btn-ghost">Verrouiller</button>
      </div>
      <div id="training-secondary-actions">
        <button id="btn-train-errors" class="btn btn-ghost" title="Tirer une position parmi tes erreurs sauvegardées">
          🎯 Mes erreurs <span id="error-count-badge"></span>
        </button>
      </div>
    </section>

    <!-- Vue Se corriger -->
    <section id="panel-correct" class="panel-view">
      <h3>Se corriger</h3>

      <div id="correct-form">
        <label class="form-row">
          <span>Pseudo Chess.com</span>
          <input type="text" id="correct-username" placeholder="MagnusCarlsen" autocomplete="off">
        </label>

        <label class="form-row">
          <span>Mois à analyser</span>
          <select id="correct-months">
            <option value="1">1 mois</option>
            <option value="2">2 mois</option>
            <option value="3" selected>3 derniers mois</option>
            <option value="6">6 mois</option>
            <option value="12">12 mois</option>
          </select>
        </label>

        <label class="toggle-row">
          <span>Uniquement avec erreur</span>
          <span class="toggle">
            <input type="checkbox" id="correct-only-errors" checked>
            <span class="toggle-track"></span>
          </span>
        </label>

        <button id="correct-fetch-btn" class="btn btn-primary">Charger mes parties</button>
      </div>

      <div id="correct-status"></div>

      <div id="correct-game-actions" class="correct-actions">
        <button id="correct-fix-btn" class="btn btn-primary">Corriger</button>
        <button id="correct-next-btn" class="btn btn-ghost">Erreur suivante →</button>
        <button id="correct-back-list-btn" class="btn btn-ghost">← Retour à la liste</button>
      </div>

      <div id="correct-games-list"></div>
    </section>
  </aside>

</div>

<!-- Libs externes -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<!-- Modules — ORDRE IMPORTANT : gamestate < sounds < board < target/tree/training < correct < main -->
<script src="{% static 'js/gamestate.js' %}"></script>
<script src="{% static 'js/sounds.js' %}"></script>
<script src="{% static 'js/board.js' %}"></script>
<script src="{% static 'js/target.js' %}"></script>
<script src="{% static 'js/tree.js' %}"></script>
<script src="{% static 'js/training.js' %}"></script>
<script src="{% static 'js/correct.js' %}"></script>
<script src="{% static 'js/main.js' %}"></script>
</body>
</html>
